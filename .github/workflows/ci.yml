name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  worktrees:
    name: worktrees (${{ matrix.privilege }})
    strategy:
      fail-fast: false
      matrix:
        privilege: [root, userns]
    runs-on: ubuntu-latest
    env:
      BEAVY_REQUIRE_WORKTREES: "1"
      BEAVY_EXPECT_PRIVILEGE: ${{ matrix.privilege }}
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Allow unprivileged user namespaces
        if: matrix.privilege == 'userns'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run every test as root
        if: matrix.privilege == 'root'
        run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=sudo -E" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --workspace --locked
